{% extends 'base.html' %}

{% block title %}부산 집 찾기 서비스{% endblock %}

{% block content %}
<div class="container">
    <h1>나에게 맞는 부산 집은?</h1>
    <p>12문항 설문으로 당신만의 집 스타일을 찾아보세요!</p>
    
    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">설문 시작</h5>
                    <p class="card-text">12문항 설문으로 집 스타일 진단</p>
                    <a href="{% url 'survey:survey_start' %}" class="btn btn-primary">시작하기</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">매물 보기</h5>
                    <p class="card-text">부산 지역 매물 정보</p>
                    <a href="{% url 'property:property_list' %}" class="btn btn-secondary">매물 보기</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">관리자</h5>
                    <p class="card-text">관리자 페이지</p>
                    <a href="{% url 'admin:index' %}" class="btn btn-outline-primary">관리자</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
