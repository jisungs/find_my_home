{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} 나에게 맞는 부산 집 찾기 서비스{% endblock %}</title>
    
    <!-- Bootstrap 5 (기능 유지) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Light Bootstrap Dashboard CSS -->
    <link href="{% static 'css/light-bootstrap-dashboard.css' %}" rel="stylesheet">
    
    <!-- Custom Busan Theme CSS -->
    <link href="{% static 'css/custom-busan-theme.css' %}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand text-white" href="{% url 'home' %}">
                <i class="fas fa-home"></i> 내 집 찾기 - 부산편
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'survey:survey_start' %}">
                    <i class="fas fa-clipboard-list"></i> 설문
                </a>
                <a class="nav-link" href="{% url 'property:property_list' %}">
                    <i class="fas fa-building"></i> 매물
                </a>
                <a class="nav-link disabled" href="{% url 'admin:index' %}">
                    <i class="fas fa-cog "></i> 관리자
                </a>
            </div>
        </div>
    </nav>
    
    <main class="py-4">
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <div class="container text-center">
            <p>&copy; 2025 나만의 집 찾기 서비스(부산편). All rights reserved.</p>
        </div>
    </footer>
    
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- jQuery (드래그 정렬용) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
</body>
</html>
