{% extends 'base.html' %}

{% block title %}설문 완료 - 부산 집 찾기{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body p-5 text-center">
                    <div class="mb-4">
                        <h1 class="display-1 text-success">🎉</h1>
                        <h2 class="card-title">설문 완료!</h2>
                        <p class="lead text-muted">{{ survey.user_name }}님, 설문에 참여해주셔서 감사합니다.</p>
                    </div>
                    
                    <div class="alert alert-info">
                        <h5><i class="fas fa-info-circle"></i> 다음 단계</h5>
                        <p class="mb-0">당신의 답변을 분석하여 맞춤형 집 스타일을 찾고 있습니다.</p>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-block">
                        <a href="{% url 'results:show_result' survey.id %}" class="btn btn-primary btn-lg">
                            <i class="fas fa-chart-line"></i> 결과 보기
                        </a>
                        <a href="{% url 'survey:survey_start' %}" class="btn btn-outline-secondary btn-lg">
                            <i class="fas fa-redo"></i> 다시 하기
                        </a>
                    </div>
                    
                    <div class="mt-4">
                        <small class="text-muted">
                            <i class="fas fa-share-alt"></i> 친구들에게도 추천해보세요!
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
